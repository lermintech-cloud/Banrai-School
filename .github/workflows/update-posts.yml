name: อัปเดตโพสต์จากเฟซบุ๊ก
on:
  schedule: [{ cron: '*/30 * * * *' }]   # ทุก 30 นาที
  workflow_dispatch:                       # กดรันเองได้
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-posts.mjs
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      - name: บันทึกถ้ามีข้อมูลใหม่
        run: |
          git config user.name "school-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json
          git diff --staged --quiet || (git commit -m "อัปเดตโพสต์ $(date -u +%F\ %H:%M)" && git push)
